[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rfp-tender-copilot"
version = "0.1.0"
description = "Deterministic tender drafting with traceable evidence and explicit gaps"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rfp = "rfp.cli:main"

[tool.setuptools.packages.find]
include = ["rfp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
